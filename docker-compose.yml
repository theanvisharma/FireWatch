version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: firewatch-postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firewatch
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firewatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: firewatch-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MOCK_MODE_ENABLED=true
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=firewatch
    ports:
      - "8000:8000"

  gis-pipeline:
    profiles: ["gis"]
    build:
      context: ./gis-pipeline
      dockerfile: Dockerfile
    container_name: firewatch-gis-pipeline
    environment:
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY:-}
    command: ["python", "run_pipeline.py", "--output", "/data/hotspots.geojson"]
    volumes:
      - gis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firewatch-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_USE_MOCK_API=false
    depends_on:
      - backend

volumes:
  postgis_data:
  gis_data:
